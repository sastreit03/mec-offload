name: mec

services:
  mec-vlm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mec
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/pytorch:25.12-py3}
    image: mec-vlm:latest
    container_name: mec-vlm
    gpus: all
    restart: unless-stopped
    networks:
      traffic_net:
        ipv4_address: 192.168.72.136
    ports:
      - "8765:8765/tcp"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ../mec_app/models/huggingface:/models/huggingface:ro

  mec-route-init:
    image: alpine:3.20
    container_name: mec-route-init
    network_mode: "service:mec-vlm"
    depends_on:
      mec-vlm:
        condition: service_started
    cap_add:
      - NET_ADMIN
    command:
        - /bin/sh
        - -c
        - |
          until ip link show eth0 >/dev/null 2>&1; do sleep 1; done
          until ping -c 1 -W 1 192.168.72.134 >/dev/null 2>&1; do sleep 1; done
          ip route replace 12.1.1.0/24 via 192.168.72.134 dev eth0
          ip route
    restart: "no"

  ran_telemetry_xapp:
    image: oai-flexric-grpc:latest
    container_name: ran-telemetry-xapp
    restart: unless-stopped
    networks:
      e2_net:
        ipv4_address: 192.168.73.156
    ports:
      - "50051:50051/tcp"
    environment:
      PYTHONUNBUFFERED: "1"
      XAPP_INTERVAL: Interval_ms_10
      MAX_DUMPS_PER_SM: "5"
      GRPC_BIND_ADDRESS: 0.0.0.0
      GRPC_PORT: "50051"
      GRPC_MAX_WORKERS: "4"
      GRPC_STREAM_INTERVAL_S: "1.0"
    volumes:
      - ${FLEXRIC_CONF}:/usr/local/etc/flexric/flexric.conf:ro
      - ../xapp/ran_telemetry_xapp.py:/xapp/ran_telemetry_xapp.py:ro
    entrypoint: python3 /xapp/ran_telemetry_xapp.py

networks:
  traffic_net:
    external: true
    name: oai-traffic-net

  e2_net:
    external: true
    name: oai-e2-net
