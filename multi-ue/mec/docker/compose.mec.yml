name: multi-ue-mec
services:
  mec:
    image: multi-ue-mec:baseline
    container_name: multi-ue-mec
    gpus: all
    restart: "no"
    ipc: host
    environment:
      CUDA_MPS_PIPE_DIRECTORY: /tmp/nvidia-mps
      CUDA_MPS_LOG_DIRECTORY: /tmp/nvidia-log
    networks:
      traffic_net:
        ipv4_address: ${MEC_TRAFFIC_IP:-192.168.72.136}
      public_net:
        ipv4_address: ${MEC_PUBLIC_IP:-192.168.71.142}
    volumes:
      - ../../config:/work/multi-ue/config:ro
      - ../../weights:/work/multi-ue/weights:ro
      - ../../runs:/work/multi-ue/runs
      - /tmp/nvidia-mps:/tmp/nvidia-mps
      - /tmp/nvidia-log:/tmp/nvidia-log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/readyz')"]
      start_period: 120s
      interval: 10s
  mec-route-init:
    image: alpine:3.20
    network_mode: service:mec
    depends_on: [mec]
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "ip route replace 12.1.1.0/24 via 192.168.72.134"]
    restart: "no"
networks:
  traffic_net:
    external: true
    name: oai-traffic-net
  public_net:
    external: true
    name: oai-public-net
