plugins { id 'com.android.application' }
android {
    namespace 'edu.clemson.mecrtp'
    compileSdk 35
    ndkVersion '27.0.12077973'
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    defaultConfig {
        applicationId 'edu.clemson.mecrtp'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '2.0'
        // Optional side-by-side install keeps campaign app data and signing untouched.
        if (project.hasProperty('encoderProfiling')) {
            applicationIdSuffix '.profiling'
            versionNameSuffix '-profiling'
        }
        manifestPlaceholders = [appLabel: project.hasProperty('encoderProfiling')
            ? 'Pixel Encoder Profiler' : 'Pixel RTP MEC']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
