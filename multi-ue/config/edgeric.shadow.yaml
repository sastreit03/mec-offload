# Shadow computes proposals without publishing weights to the gNB.
mode: shadow
listen: 0.0.0.0:50052
runs_dir: runs/edgeric
max_sessions: 64
# Aetheredge: Initially treat new-data TBS as payload; MEC progress remains confirmed.
payload_fraction: 1.0
capacity_max_age_s: 0.3
log_weight_samples: true
utility:
  b_min: 1.0
  delta_s: 0.0005
  alpha: 1.0
  beta: 1.0
association:
  interval_s: 0.2
  lead_s: 1.0
  settle_s: 0.4
  rate_bps: 1000000
  min_correlation: 0.8
  min_margin: 0.15
  lease_s: 30.0
  revalidate_before_s: 10.0
  min_received_bytes: 20000
ran_telemetry:
  aggregation_window_ms: 100
  report_interval_ms: 100
  stale_ms: 300
  prolonged_outage_s: 5
